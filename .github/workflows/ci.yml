name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      # Counts stated in prose have drifted five times, and the fifth was caught by this
      # script rather than by re-reading. PLAN.md §F1 asked for it in CI; here it is.
      #
      # Deliberately NOT part of `npm run build`: a doc-count drift should fail review, not
      # block a production deploy — and keeping python out of the deploy path means the
      # build cannot break on a container that happens to lack it.
      - name: Docs are self-consistent
        run: npm run check:docs

      - name: Card index is reproducible
        run: |
          python3 tools/collection/build-index.py
          git diff --exit-code tools/collection/cards-index.json

      # The card pool is generated, not authored (D-034). Same guard as the card index:
      # editing the generator without regenerating would leave the committed file lying.
      - name: Card pool is reproducible
        run: |
          node scripts/build-card-index.mjs
          git diff --exit-code apps/web/public/cards.json

      # ⚠️ This one step is the whole deploy gate, and it is deliberately the EXACT command
      # Cloudflare runs. Workers Builds deploys on every push to main using its own build
      # command and does **not** wait for this workflow — so a gate that lived only here
      # would let a failing test ship to production while GitHub went red beside it.
      #
      # `npm run build` therefore runs engine purity (D-047), typecheck and the full test
      # suite before it emits a single asset. Running it here proves the gate itself works.
      - name: Deploy gate — engine purity, typecheck, tests, then build
        run: npm run build
