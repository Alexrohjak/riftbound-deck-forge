# One Worker, no idle state (D-048). Deployed by `npm run deploy -w @forge/api`,
# but only after the Cloudflare half of F1 exists — see docs/ARCHITECTURE.md §9.
#
# This Worker serves the app as well as the API (D-050): Cloudflare stopped taking new
# Pages projects, and static assets on Workers is the supported replacement. One origin
# means the app calls /collection relatively — no CORS, no API URL to configure, and one
# Access application protects everything.
name = "forge"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The built SPA. `run_worker_first` keeps the API paths with the Worker — without it the
# SPA fallback below would answer /health, /collection and /decks/* with index.html, and
# a deck save would silently "succeed" against an HTML page.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
# `/__scheduled` exists only under `wrangler dev --test-scheduled`, and without it here the
# asset router answers the cron-trigger endpoint with index.html — so the nightly backup
# cannot be exercised locally at all. In production nothing routes there.
#
# ⚠️ Adding an API route means editing this list too, and forgetting is silent — the route
# answers with index.html and a POST "succeeds" against an HTML page. `route-coverage.test.ts`
# fails when a path in src/ is missing here, because this comment was already present and did
# not stop it happening.
run_worker_first = [
  "/health",
  "/collection",
  "/decks",
  "/decks/*",
  "/commitments",
  "/matches",
  "/matches/*",
  "/events",
  "/__scheduled",
]

# Created with:  npx wrangler d1 create forge
# then paste the returned database_id here. It is an identifier, not a secret.
[[d1_databases]]
binding = "DB"
database_name = "forge"
database_id = "0dd2f27e-30bc-421b-99c1-43c224dd7269"

[observability]
enabled = true

# X8 — the nightly backup (D-051). 03:12 UTC rather than 03:00: every cron on the platform
# fires on the hour, and there is no reason to queue behind them.
#
# Free-plan scheduled invocations get 10 ms CPU. Reading a few hundred rows and serialising
# them is well inside that — waiting on D1 and on GitHub is I/O, which does not count.
[triggers]
crons = ["12 3 * * *"]

[vars]
# Not secrets — the repo is in the git remote already, and the branch is public knowledge.
# GITHUB_TOKEN is the only secret, set with:  npx wrangler secret put GITHUB_TOKEN
BACKUP_REPO = "Alexrohjak/riftbound-deck-forge"
BACKUP_BRANCH = "backups"
BACKUP_PATH = "backups/forge-state.json"
